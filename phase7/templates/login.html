<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — SafeRoute</title>
{% include "_auth_style.html" %}
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-badge">SR</div>
      <div>
        <h1>SafeRoute</h1>
        <p>Women's safety navigator</p>
      </div>
    </div>

    <h2>Sign in</h2>
    <p class="subtitle">Use your email or mobile number.</p>

    <form id="login-form">
      <label for="identifier">Email or mobile number</label>
      <input id="identifier" name="identifier" type="text" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button class="btn-primary" type="submit">Sign in</button>

      <div class="error-box" id="error-box"><ul id="error-list"></ul></div>
    </form>

    <p class="switch-link">Don't have an account? <a href="/register">Register</a></p>
  </div>

<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const errorList = document.getElementById('error-list');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const data = Object.fromEntries(new FormData(form).entries());

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();
      if (result.ok) {
        window.location.href = result.redirect || '/';
      } else {
        errorList.innerHTML = (result.errors || ['Something went wrong.']).map(e => `<li>${e}</li>`).join('');
        errorBox.style.display = 'block';
      }
    } catch (err) {
      errorList.innerHTML = '<li>Could not reach the server. Is app.py running?</li>';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>

<style>
  :root {
    --bg-void: #0B1220;
    --panel: #121B2E;
    --panel-2: #17213A;
    --panel-border: #24314F;
    --ink: #EAF0FA;
    --muted: #8792A8;
    --safe: #22D3B0;
    --mid: #F5A524;
    --risk: #EF4444;
    --accent: #8B7CF6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-void);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 32px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .brand-badge {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--safe));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #0B1220;
  }
  .brand h1 { font-size: 18px; margin: 0; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #101A2E;
    color: var(--ink);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  fieldset {
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    margin-top: 18px;
    padding: 4px 14px 14px;
  }
  legend { font-size: 12px; color: var(--muted); padding: 0 6px; }
  .btn-primary {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #0B1220;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary:hover { background: #9d8ff8; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .switch-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 18px; }
  .switch-link a { color: var(--safe); text-decoration: none; }
  .switch-link a:hover { text-decoration: underline; }
  .error-box {
    display: none;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--risk);
    color: #FCA5A5;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 16px;
  }
  .error-box ul { margin: 4px 0 0; padding-left: 18px; }
  .success-box {
    display: none;
    background: rgba(34, 211, 176, 0.1);
    border: 1px solid var(--safe);
    color: var(--safe);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 16px;
  }
</style>
